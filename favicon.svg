<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Notebook body -->
  <rect x="5" y="4" width="22" height="26" rx="3" fill="#D9B382"/>
  <!-- Spine -->
  <rect x="5" y="4" width="5" height="26" rx="3" fill="#C49A3C"/>
  <rect x="7" y="4" width="3" height="26" fill="#C49A3C"/>
  <!-- Ruled lines -->
  <line x1="13" y1="11" x2="24" y2="11" stroke="#CC7E63" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="13" y1="15" x2="24" y2="15" stroke="#CC7E63" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="13" y1="19" x2="24" y2="19" stroke="#CC7E63" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Yen symbol -->
  <text x="19" y="28" text-anchor="middle" font-size="9" fill="#8A9A5B" font-weight="bold" font-family="sans-serif">¥</text>
  <!-- Pen -->
  <g transform="rotate(25, 24, 8)">
    <rect x="22" y="1" width="4" height="10" rx="1.5" fill="#CC7E63"/>
    <polygon points="22,11 26,11 24,15" fill="#F5F2ED"/>
  </g>
</svg>
